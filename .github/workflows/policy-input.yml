name: Policy input boundary

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore tests/PolicyInput.Tests/PolicyInput.Tests.csproj --locked-mode
      - run: dotnet test tests/PolicyInput.Tests/PolicyInput.Tests.csproj -c Release --no-restore
