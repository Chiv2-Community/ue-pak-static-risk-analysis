name: Compatibility probe

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore pinned packages
        run: dotnet restore tests/CompatibilityProbe.Tests/CompatibilityProbe.Tests.csproj --locked-mode
      - name: Test synthetic Blueprint models
        run: dotnet test tests/CompatibilityProbe.Tests/CompatibilityProbe.Tests.csproj -c Release --no-restore
      - name: Restore policy packages
        run: dotnet restore tests/Policy.Tests/Policy.Tests.csproj --locked-mode
      - name: Test YAML policy AST
        run: dotnet test tests/Policy.Tests/Policy.Tests.csproj -c Release --no-restore
      - name: Test format rejection
        run: |
          python3 -m venv "$RUNNER_TEMP/python-test-venv"
          "$RUNNER_TEMP/python-test-venv/bin/pip" install -r tests/requirements.txt
          "$RUNNER_TEMP/python-test-venv/bin/python" -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build extractor without Oodle downloads
        run: cargo build --locked --release --manifest-path vendor/repak/Cargo.toml -p repak_cli --no-default-features
