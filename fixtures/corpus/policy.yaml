schema-version: 1
rules:
  - id: corpus-possible-dispatch
    description: corpus-policy-canary possible callback
    effect: forbid
    expression:
      invocation: /Game/Unresolved.BP_Corpus_C:DynamicDispatch
  - id: corpus-policy-canary
    description: 'corpus-policy-canary ::warning:: ##[error] $() `not executed`'
    effect: forbid
    expression:
      invocation: /Script/Corpus.Sensitive:Record
  - id: corpus-local-constant
    description: corpus-policy-canary local constant
    effect: flag
    expression:
      invocation:
        function: /Game/Calls.BP_Corpus_C:Local
        args:
          - argument:
              name: Value
              predicate:
                kind: equals
                value:
                  kind: integer
                  value: 1
